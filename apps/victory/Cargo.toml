[package]
name = "victory"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# This fork's program is `pilotebox.exe` (`victory_core::product`); the
# package and its crate keep upstream's name, `victory`.
[[bin]]
name = "pilotebox"
path = "src/main.rs"

[dependencies]
victory-core.workspace = true
victory-pe.workspace = true
victory-loader.workspace = true
victory-hle.workspace = true
victory-shader = { workspace = true, features = ["host"] }
victory-game.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
walkdir.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# `pilotebox doctor` asks the graphics card what a run asks it; `bench`
# closes a run's window; both read the time, memory, free space, processes.
windows = { workspace = true, features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[features]
# Debug-level logs and the debugging switches (frame capture, stack dumps,
# the host debug layer, scripted keys). Off in a plain release build.
diagnostics = [
    "victory-core/diagnostics",
    "victory-hle/diagnostics",
    "victory-loader/diagnostics",
    "victory-shader/diagnostics",
]
mimalloc = ["victory-hle/mimalloc"]

[lints]
workspace = true
