name: Performance report
description: Numbers from `pilotebox bench` on your machine. No game is named here.
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        One run on a quiet machine (no build, no other game) is worth more than five beside a build.
        Write "the title", not a game's name.
  - type: input
    id: card
    attributes:
      label: Card, processor, memory
      placeholder: "RTX 4070 SUPER 12 GB, Ryzen 7 7700X, 32 GB"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Series X profile (default)
        - Series S profile (--mode s)
        - with --rt
    validations:
      required: true
  - type: textarea
    id: bench
    attributes:
      label: The report `pilotebox bench` wrote (the .md file), or its last line
      render: text
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: Scene and anything unusual
      description: "Where in the title, in words (for instance: the prologue's first playable scene), and what else was running."
  - type: textarea
    id: doctor
    attributes:
      label: Output of `pilotebox doctor`
      render: text
