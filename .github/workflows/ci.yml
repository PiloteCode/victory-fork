name: CI

# Every pull request and every push to main: the asset policy, the release
# build, the lints of the packages that are clean, and the tests that need no
# graphics card (the layer's and the translator's run on the software adapter).
# The same commands are in CONTRIBUTING.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Policy and release build
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: build
      # Nothing derived from a game in the repository; no file over the size limit.
      - name: Asset policy
        run: cargo run --locked -p xtask -- policy
      - name: Release build
        run: cargo build --release --locked -p victory
      - name: The program answers
        run: target\release\pilotebox.exe --version

  lints:
    name: Lints
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: lints
      # The packages that are clean today. Left out until their old findings
      # are fixed: victory-formats (a test's operator precedence),
      # victory-loader (four transmutes without annotations), victory-gpu,
      # victory-hle and the program itself, which compile those.
      - name: Clippy
        run: cargo clippy --locked -p victory-core -p victory-pe -p victory-game -p victory-pipeline -p victory-shader -p xtask --all-targets -- -D warnings

  tests:
    name: Tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: tests
      # Includes xtask's repository_passes_policy and the commands' own tests.
      - name: Tests without a graphics adapter
        run: cargo test --locked --no-fail-fast -p victory-core -p victory-pe -p victory-formats -p victory-loader -p victory-game -p victory-pipeline -p xtask -p victory
      - name: Runtime tests
        run: cargo test --locked --no-fail-fast -p victory-hle -- --test-threads=1
      # The translator on the software adapter (WARP). Skipped by name: eight
      # tests that pass on a card and fail on WARP, which orders signed zeros
      # its own way, refuses one LDS pipeline and has waves of four lanes.
      - name: Translator tests on the software adapter
        env:
          VICTORY_WARP: "1"
        run: >
          cargo test --locked --no-fail-fast -p victory-shader -- --test-threads=1
          --skip a_mask_carried_round_a_loop_is_read_as_the_number_it_is
          --skip ds_min_max_f32_order_floats_and_return_the_old_value
          --skip host_max_and_min_order_signed_zeros
          --skip lds_subtractions_get_a_pipeline_and_stay_atomic
          --skip lean_legacy_multiply_matches_the_default_on_the_card
          --skip v_permlane16_and_x16_read_the_lanes_their_selectors_pick
          --skip whole_wave_f64_sum_and_cvt_f32_f64
          --skip a_lane_mask_joined_with_a_number_is_read_as_the_number_it_is
      # The layer on the software adapter. Skipped by name: WARP does not
      # reject pixels outside the depth bounds; two tests of the indirect
      # budget still assume a default that changed (being rewritten).
      - name: Layer tests on the software adapter
        env:
          VICTORY_D3D12_WARP: "1"
        run: >
          cargo test --locked --no-fail-fast -p victory-gpu --features diagnostics -- --test-threads=1
          --skip depth_bounds_pipeline_loads_and_filters_draws
          --skip host_list_budget_starts_empty_at_each_submission
          --skip warp_batch_charges_every_execution
