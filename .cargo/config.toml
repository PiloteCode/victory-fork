[alias]
xtask = "run --quiet --package xtask --"

# Code for x86-64-v3 (AVX2, FMA, BMI2): the title itself needs AVX2 (`victory
# run` checks for it before it starts one), so no machine that can play it
# lacks these. Measured on our earlier tree with thin LTO and one codegen unit
# (Cargo.toml's release profile, which diag inherits): about 7 % a frame in
# the world. Applies to every build of the workspace (stable cargo has no
# flags by profile); RUSTFLAGS set in the environment replace it.
[build]
rustflags = ["-C", "target-cpu=x86-64-v3"]
