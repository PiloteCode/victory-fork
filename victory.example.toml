# Copy to `pilotebox.toml` (or upstream's `victory.toml`; both git-ignored)
# and point it at YOUR files, or let `pilotebox setup` write one in
# %LOCALAPPDATA%\PiloteBox. Every path must be OUTSIDE the repository; the
# tools refuse otherwise. Environment variables (shown below) take
# precedence over this file; each PILOTEBOX_ name also works as VICTORY_.
# PILOTEBOX_CONFIG selects a different config file.

[paths]
# Your own dump of the title.     env: PILOTEBOX_GAME_DIR
game_dir = 'D:\pilotebox-data\game'

# PC FSR 4.1.2 upscaler for VICTORY_FSR_4K (Series X profile).   env: PILOTEBOX_FIDELITYFX_DIR
# fidelityfx_dir = 'D:\pilotebox-data\fidelityfx-4.1.2'

# PC FidelityFX frame generation (Series S, VICTORY_FRAMEGEN=1). Defaults to
# fidelityfx_dir.   env: PILOTEBOX_FFX_FG_DIR
# ffx_fg_dir = 'D:\pilotebox-data\fidelityfx-signedbin'

# NVIDIA's nvngx_dlss.dll for VICTORY_DLSS / VICTORY_DLSS_4K (optional: the
# driver's copy otherwise).   env: PILOTEBOX_DLSS_DIR
# dlss_dir = 'D:\pilotebox-data\dlss'

# Derived data. Default: %LOCALAPPDATA%\PiloteBox\cache.   env: PILOTEBOX_CACHE_DIR
# cache_dir = 'D:\pilotebox-data\cache'

# What titles save (persistent local storage), kept apart from the cache.
# Default: %LOCALAPPDATA%\PiloteBox\data.   env: PILOTEBOX_DATA_DIR
# data_dir = 'D:\pilotebox-data\data'

# Other Xbox Series titles used to test platform-level code.
# env: PILOTEBOX_TEST_TITLES (separated by ';')
test_titles = []
